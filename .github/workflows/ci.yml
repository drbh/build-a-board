name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # KiCad's footprint libraries the hosted playground serves; keep in step with
  # the KiCad release bb is tested against.
  KICAD_FOOTPRINTS_TAG: "10.0.7"

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: make test

  site:
    name: Playground and book
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: playground/core-wasm
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Cache the browser compiler
        uses: actions/cache@v4
        with:
          path: |
            playground/.cache/rustc-wasm.tar.zst
            playground/.cache/wasip1-sysroot.tar.zst
          key: compiler-${{ hashFiles('playground/tools/fetch-compiler.sh') }}
      - name: Fetch KiCad's footprints
        run: git clone --quiet --depth 1 --branch "$KICAD_FOOTPRINTS_TAG" https://gitlab.com/kicad/libraries/kicad-footprints.git "$RUNNER_TEMP/kicad-footprints"
      - name: Build and stage the site
        run: make site
        env:
          KICAD_FOOTPRINT_DIR: ${{ runner.temp }}/kicad-footprints
      - name: Keep the staged site for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            playground/cloud/site
            playground/cloud/r2
          include-hidden-files: true
          retention-days: 1

  deploy:
    # bb.dholtz.com is rebuilt from every green push to main. Needs the
    # CLOUDFLARE_API_TOKEN repository secret (Workers Scripts:Edit, R2:Edit).
    name: Deploy bb.dholtz.com
    needs: [rust, site]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - run: npm --prefix playground ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: playground/cloud
      - name: Deploy
        run: playground/cloud/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
